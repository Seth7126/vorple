# -----------------------------------------------------------------------------
# 工作流目的说明：
# 本脚本用于在 GitHub Actions 中稳定编译 vorple 项目。
# 核心机制是通过禁用 setup-node 的缓存功能来阻断受污染环境变量的注入，
# 并使用 --ignore-engines 参数强制规避 @typescript-eslint 等依赖的 Node 版本强校验，
# 确保在任意底层依赖冲突的情况下顺利完成构建并输出产物。
# -----------------------------------------------------------------------------

name: Build Vorple

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 配置纯净 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          # 明确移除缓存选项，断绝历史受污染的 Yarn 引擎缓存对当前路径的覆盖

      - name: 强制安装项目依赖
        # 直接使用行内参数，优先级最高，无视所有 package.json 的引擎要求
        run: yarn install --ignore-engines

      - name: 执行代码构建与资源打包
        run: |
          export NODE_ENV=production
          
          # 从 package.json 提取版本号并动态注入到 TypeScript 源码中
          VORPLE_VERSION=$(grep version package.json | sed 's/.*"version": "\(.*\)".*/\1/')
          sed -i -E "s/(const VORPLE_VERSION =) \"(.*)\"/\1 \"$VORPLE_VERSION\"/" src/index.ts
          
          # 清理历史目录，防止旧产物残留
          rm -rf dist lib web
          
          # 使用 npx 调用当前项目 node_modules 下的二进制文件
          # 这可以避免使用 yarn run 时再次触发 yarn 自身的引擎拦截逻辑
          npx webpack
          npx tsc -p tsconfig.json
          
          # 拷贝所需的第三方库和字体文件
          cp -r src/quixe lib
          mkdir -p lib/css
          cp web/interpreter/roboto-*.woff* lib/css/
          
          # 将分散的 CSS 样式表按顺序合并为单一的 vorple.css
          cat web/interpreter/roboto.css \
              web/interpreter/jquery.powertip.css \
              web/interpreter/toastr.css \
              web/interpreter/vex.css \
              web/interpreter/vex-theme-plain.css \
              web/interpreter/haven.css \
              web/interpreter/vorple.css > lib/css/vorple.css

      - name: 收集并上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: vorple-build
          path: |
            dist/
            lib/
            web/
          retention-days: 30
