# =============================================================================
# 工作流目的说明：
# 此脚本专门用于在由于 Self-hosted Runner 环境变量污染导致 Node 版本锁定在 
# 15.14.0 等被弃用版本的极端环境中，稳定编译 Vorple 项目。
# 
# 核心解决机制：
# 1. 动态生成项目级别的 .yarnrc 和 .npmrc 配置文件，永久关闭当前工作空间内所有
#    包管理器的引擎版本校验机制（ignore-engines / engine-strict）。
# 2. 将原本构建逻辑中依赖的 yarn webpack 替换为 `npx webpack`。这使得系统直接
#    调用 node_modules/.bin/webpack 二进制文件，彻底规避 Yarn 在执行 run 
#    指令时的二次引擎检查拦截。
# 3. 展开并修正原 build.sh 中的 macOS 专有逻辑，完成 TypeScript 编译与 CSS 拼接。
# =============================================================================

name: Build Vorple

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 尝试配置 Node.js 环境 (作为降级保障)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 强制关闭全链路包管理器引擎校验
        run: |
          # 向当前工作目录写入配置文件，强制拦截所有引擎版本不匹配报错
          echo "ignore-engines true" > .yarnrc
          echo "engine-strict=false" > .npmrc

      - name: 安装项目依赖
        # 此时配置已生效，执行 install 将完全无视 Node 15.14.0 带来的版本警告或阻断
        run: yarn install

      - name: 执行环境适配与代码构建
        run: |
          # 修正 macOS 专用的 sed 语法以适配通用 Linux 环境
          sed -i "s/sed -i '' -E/sed -i -E/" build.sh
          chmod +x build.sh
          
          export NODE_ENV=production
          VORPLE_VERSION=$(grep version package.json | sed 's/.*"version": "\(.*\)".*/\1/')
          sed -i -E "s/(const VORPLE_VERSION =) \"(.*)\"/\1 \"$VORPLE_VERSION\"/" src/index.ts
          
          rm -rf dist lib web
          
          # 核心修正：使用 npx 替代引发错误的 yarn webpack
          npx webpack
          npx tsc -p tsconfig.json
          
          cp -r src/quixe lib
          mkdir -p lib/css
          cp web/interpreter/roboto-*.woff* lib/css/
          
          cat web/interpreter/roboto.css \
              web/interpreter/jquery.powertip.css \
              web/interpreter/toastr.css \
              web/interpreter/vex.css \
              web/interpreter/vex-theme-plain.css \
              web/interpreter/haven.css \
              web/interpreter/vorple.css > lib/css/vorple.css

      - name: 收集并上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: vorple-build
          path: |
            dist/
            lib/
            web/
          retention-days: 30
